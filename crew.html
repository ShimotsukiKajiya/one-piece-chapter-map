<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0c0a14;--surface:#1a1610;--surface2:#251f15;--border:#4a3820;--text:#e8d8b0;--muted:#8a7548;--gold:#d4a44a;--gold-bright:#f5c95e;--ink-blue:#6a9ec8;--green:#5fb35f;--orange:#FF6B1A}
  body{background:radial-gradient(circle at 25% 15%,rgba(212,164,74,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:14px 14px;pointer-events:none;z-index:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:rgba(26,22,16,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
  .logo{text-decoration:none;color:inherit}
  .logo h1{font-size:1.4rem;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  nav a{color:var(--text);text-decoration:none;font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;padding:6px 10px;border-radius:6px}
  nav a:hover,nav a.active{color:var(--gold-bright);background:var(--surface2)}

  main{max-width:1000px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:1}
  .crumbs{color:var(--muted);font-size:.8rem;margin-bottom:16px}
  .crumbs a{color:var(--ink-blue);text-decoration:none}
  .head{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:24px 28px;margin-bottom:22px}
  .name{font-size:2rem;font-weight:900;color:var(--gold-bright);letter-spacing:1px}
  .quick{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;color:var(--muted);font-size:.9rem}
  .quick strong{color:var(--text)}

  .group{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:14px}
  .group.tier-elite{border-left:4px solid var(--gold);background:linear-gradient(90deg, rgba(212,164,74,.06) 0%, var(--surface) 35%)}
  .group.tier-officer{border-left:3px solid var(--ink-blue)}
  .group.tier-tail{opacity:.78}
  .group h3{color:var(--gold);font-size:.82rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .group .tier-num{font-family:'Consolas',monospace;color:var(--muted);font-size:.7rem;letter-spacing:1px;font-weight:400;background:var(--surface2);padding:2px 7px;border-radius:4px}
  .group .tier-label{flex:1}
  .group .tier-count{background:var(--surface2);color:var(--gold-bright);padding:2px 9px;border-radius:10px;font-size:.7rem;letter-spacing:1px;font-weight:700}
  .group.tier-elite h3 .tier-label{color:var(--gold-bright)}
  .tier-badge{background:rgba(212,164,74,.15);border:1px solid var(--gold);color:var(--gold-bright);padding:3px 10px;border-radius:12px;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .ship-badge{background:rgba(106,158,200,.15);border:1px solid var(--ink-blue);color:var(--ink-blue);padding:3px 10px;border-radius:12px;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .group.ships-group{border-left:3px solid var(--ink-blue);background:linear-gradient(90deg, rgba(106,158,200,.06) 0%, var(--surface) 35%)}
  .ships-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .ship-tile{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:all .12s}
  .ship-tile:hover{border-color:var(--ink-blue);transform:translateX(2px);color:var(--gold-bright)}
  .ship-tile .ship-icon{font-size:1.4rem;color:var(--ink-blue);flex-shrink:0}
  .ship-tile .ship-info{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .ship-tile .ship-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ship-tile .ship-debut{font-size:.7rem;color:var(--muted);letter-spacing:.5px}
  .members{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .member{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:border-color .12s,color .12s,transform .12s;font-size:.92rem;min-height:54px}
  .member:hover{border-color:var(--gold);color:var(--gold-bright);transform:translateX(2px)}
  .member .portrait{
    width:42px;height:42px;flex-shrink:0;
    border-radius:50%;background:var(--surface);
    border:2px solid var(--border);
    overflow:hidden;display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-weight:800;font-size:1rem;font-family:Georgia,serif;
    position:relative;
  }
  .member:hover .portrait{border-color:var(--gold)}
  .member .portrait img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .member .info{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .member .mname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member .role{font-size:.68rem;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .member:hover .role{color:var(--gold)}
  .member .captain-mark{position:absolute;bottom:-2px;right:-2px;font-size:.65rem;background:var(--gold);color:#1a1610;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surface2);font-weight:900}

  .not-found{text-align:center;padding:60px 24px;border:1px dashed var(--border);border-radius:12px}
  .not-found h2{color:var(--gold);margin-bottom:12px}
  .not-found a{display:inline-block;margin-top:18px;background:var(--gold);color:var(--bg);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}

  footer{padding:30px 24px 50px;text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:1px;border-top:1px solid var(--border);max-width:1000px;margin:0 auto}
</style>

<style id="spoiler-portrait-gate">
/* L18+L20: Silhouette character portraits + bounty poster images for users
   who haven't caught up. The portrait files themselves are post-timeskip /
   Egghead-era visuals; rendering them at low cutoff leaks the timeskip and
   late-arc evolution. brightness(0) blacks out the image content while
   preserving its layout box, giving a clean silhouette feel. Caught-up
   readers see the originals as intended. */
html[data-spoiler-silhouette="1"] .char-portrait img,
html[data-spoiler-silhouette="1"] .poster-portrait img,
html[data-spoiler-silhouette="1"] .poster-art img,
html[data-spoiler-silhouette="1"] img.char-img,
html[data-spoiler-silhouette="1"] img.bounty-img {
  content: url('assets/silhouettes/generic-character-v02.jpg') !important; object-fit: cover !important;
  opacity: 0.55 !important;
}
html[data-spoiler-silhouette="1"] .char-portrait::after,
html[data-spoiler-silhouette="1"] .poster-portrait::after {
  content: "🛡 silhouette";
  position: absolute; bottom: 2px; right: 2px;
  font-size: 0.62rem; color: #6a9ec8;
  background: rgba(26,22,16,0.7); padding: 1px 5px;
  border-radius: 3px; pointer-events: none;
}
</style>

    const byTier = {};

    for (const m of c.members) {
      const k = m.tier_label || (m.status === "current" ? "Members" : (m.status || "Members"));
      (byTier[k] = byTier[k] || []).push(m);
      const p = (m.tier_priority != null) ? m.tier_priority : 60;
      if (tierMeta[k] == null || p < tierMeta[k]) tierMeta[k] = p;
    }
    // Sort tiers by priority (lower = higher rank), then alpha as tiebreak
    const keys = Object.keys(byTier).sort((a, b) => {
      const dp = (tierMeta[a] ?? 60) - (tierMeta[b] ?? 60);
      if (dp !== 0) return dp;
      return a.localeCompare(b);
    });
    const isHierarchical = c.members.some(m => m.tier_source === "curated");

    root.innerHTML = `
      <div class="crumbs">
        <a href="home.html">Home</a> ›

          ${(c.ships && c.ships.length) ? `<span class="ship-badge">⛵ ${c.ships.length} ship${c.ships.length === 1 ? '' : 's'}</span>` : ''}
        </div>
      </div>
      ${(c.ships && c.ships.length) ? `<div class="group ships-group">

            <span class="ship-info">
              <span class="ship-name">${escapeHTML(s.name)}</span>
              ${s.debut_chapter ? `<span class="ship-debut">Ch. ${s.debut_chapter}</span>` : ''}
            </span>
          </a>`).join('')}
        </div>
      </div>` : ''}
      ${keys.map((label, tierIdx) => {
        // Inside a tier: rank-0 first (captains), then by occupation rank, then alpha
        const members = byTier[label].slice().sort((a, b) => {
          const ar = (a.rank == null ? 9 : a.rank);
          const br = (b.rank == null ? 9 : b.rank);
          if (ar !== br) return ar - br;
          return a.name.localeCompare(b.name);
        });
        const tierClass = (tierMeta[label] ?? 60) <= 10 ? 'group tier-elite'
                        : (tierMeta[label] ?? 60) <= 30 ? 'group tier-officer'
                        : (tierMeta[label] ?? 60) >= 80 ? 'group tier-tail'
                        : 'group';
        return `<div class="${tierClass}">
          <h3>
            <span class="tier-num">${String(tierIdx + 1).padStart(2,'0')}</span>
            <span class="tier-label">${escapeHTML(label)}</span>
            <span class="tier-count">${members.length}</span>
          </h3>
          <div class="members">
            ${members.map(m => {
              const role = m.role ? `<span class="role">${escapeHTML(m.role.split(';')[0].trim())}</span>` : '';
              const initial = (m.name || "?").trim().charAt(0).toUpperCase();

              const portraitHTML = portrait
                ? `<img src="${escapeHTML(portrait)}" alt="" loading="lazy" onerror="this.remove()">`
                : `<span>${escapeHTML(initial)}</span>`;
              const captain = (m.rank === 0) ? `<span class="captain-mark" title="Captain">★</span>` : '';
              const hasForms = (window.OPForms && window.OPForms.has(m.name));

                <span class="info">
                  <span class="mname">${escapeHTML(m.name)}</span>${role}
                </span>
              </a>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    `;
    }  // close L7 gate else
  }
}

<script>
  // Spoiler Shield: page-scoped soft gate. Reads effective cutoff so the
  // page can later add filter logic via this hook. Currently a no-op for
  // pages whose data shape needs more work to gate (LORE essays mostly
  // pass through but character link lists are filtered by chr-link-upgrader).
  if (typeof CodexSpoiler !== "undefined") {
    var _pageCutoff = CodexSpoiler.effectiveCutoff("public");
    document.documentElement.dataset.spoilerCutoff = _pageCutoff;
  }
</script>
<script>
// L18+L20 portrait silhouette gate. Sets data-spoiler-silhouette="1" on
// <html> when the user's cutoff is less than LATEST_PUBLISHED_CHAPTER.
// CSS rule above handles the silhouette via brightness(0). Re-runs on
// CodexSpoiler.onChange so toggling caught-up flips the silhouette live.
(function () {
  function _spoilerSilCutoff() {
    if (typeof CodexSpoiler !== 'undefined' && CodexSpoiler.snapshot) {
      const ch = CodexSpoiler.snapshot().cutoff_chapter || 0;
      return ch >= 1181 ? 1181 : ch;
    }
    try {
      const raw = JSON.parse(localStorage.getItem('codex-spoiler-state') || 'null');
      const ch = raw && raw.cutoff_chapter || parseInt(localStorage.getItem('spoilerCutoff') || '0', 10);
      return Math.min(Math.max(ch || 0, 0), 1181);
    } catch (_) { return 0; }
  }
  function _applySilhouette() {
    const ch = _spoilerSilCutoff();
    if (ch >= 1181 || ch === 0) {
      document.documentElement.removeAttribute('data-spoiler-silhouette');
    } else {
      document.documentElement.setAttribute('data-spoiler-silhouette', '1');
    }
  }
  _applySilhouette();
  function _wireOnChange() {
    if (typeof CodexSpoiler !== 'undefined' && CodexSpoiler.onChange) {
      CodexSpoiler.onChange(_applySilhouette);
    } else { setTimeout(_wireOnChange, 100); }
  }
  _wireOnChange();
})();
</script>
