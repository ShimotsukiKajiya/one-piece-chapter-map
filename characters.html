<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #0c0a14;
    --surface:   #1a1610;
    --surface2:  #251f15;
    --border:    #4a3820;
    --text:      #e8d8b0;
    --muted:     #8a7548;
    --orange:    #FF6B1A;
    --gold:      #d4a44a;
    --gold-bright:#f5c95e;
    --ink-blue:  #6a9ec8;
  }

  body {
    background:
      radial-gradient(circle at 25% 15%, rgba(212,164,74,0.05) 0%, transparent 50%),
      radial-gradient(circle at 75% 85%, rgba(106,158,200,0.04) 0%, transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 14px 14px; pointer-events:none; z-index:0;
  }

  header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    background: rgba(26,22,16,0.7); backdrop-filter: blur(6px);
    position: sticky; top:0; z-index: 50;
  }
  .logo { text-decoration:none; color:inherit; }
  .logo h1 {
    font-size: 1.4rem; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-sub { font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  nav { display:flex; gap: 18px; align-items:center; flex-wrap: wrap; }
  nav a {
    color: var(--text); text-decoration:none; font-size: 0.85rem;
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 6px 10px; border-radius: 6px;
  }
  nav a:hover, nav a.active { color: var(--gold-bright); background: var(--surface2); }

  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; position: relative; z-index: 1; }

  .page-title {
    font-size: 2rem; letter-spacing: 4px; text-transform: uppercase;
    color: var(--gold-bright); font-weight: 900; margin-bottom: 6px;
  }
  .page-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }

  .controls {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 24px; align-items: center;
  }
  .search-box {
    flex: 1; min-width: 240px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    color: var(--text); font-size: 1rem;
  }
  .search-box:focus {
    outline: none; border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,164,74,0.15);
  }
  .filter-pill {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 999px;
    font-size: 0.8rem; letter-spacing: 1px; cursor: pointer;
    text-transform: uppercase;
  }
  .filter-pill.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  .filter-pill:hover:not(.active) { border-color: var(--gold); color: var(--gold-bright); }

  .stats {
    color: var(--muted); font-size: 0.85rem;
    margin: 8px 0 20px;
  }
  .stats strong { color: var(--gold-bright); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .char-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    text-decoration: none; color: inherit;
    transition: border-color .15s, transform .15s;
    display: flex; gap: 12px; align-items: stretch;
  }
  .char-card:hover {
    border-color: var(--gold); transform: translateY(-2px);
  }
  .char-portrait {
    width: 64px; flex-shrink: 0;
    border-radius: 8px; overflow: hidden;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; color: var(--muted);
  }
  .char-portrait { position: relative; }
  .char-portrait::before {
    content: attr(data-initial);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 900;
    color: var(--gold-bright);
    font-family: Georgia, serif;
    letter-spacing: 1px;
    z-index: 0;
  }
  .char-portrait img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    position: relative; z-index: 1;
  }
  
  .char-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; justify-content: center; }
  .char-name {
    font-weight: 700; color: var(--gold-bright); font-size: 1.05rem;
    line-height: 1.3;
  }
  .char-epithet {
    font-style: italic; color: var(--ink-blue); font-size: 0.85rem;
    line-height: 1.3;
  }
  .char-meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 0.72rem; color: var(--muted);
    margin-top: 4px;
  }
  .char-meta span::before { content: "· "; color: var(--border); }
  .char-meta span:first-child::before { content: ""; }
  .char-quality {
    display: inline-block; width: 7px; height: 7px;
    border-radius: 50%; margin-left: auto; flex-shrink: 0;
    align-self: center; opacity: 0.75;
  }
  .char-quality::before { content: "" !important; }
  .char-quality.q-rich  { background: #4ade80; }
  .char-quality.q-std   { background: #60a5fa; }
  .char-quality.q-min   { background: var(--muted); }

  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    border: 1px dashed var(--border); border-radius: 12px;
  }

  footer {
    padding: 30px 24px 50px; text-align: center;
    font-size: 0.75rem; color: var(--muted); letter-spacing: 1px;
    border-top: 1px solid var(--border); max-width: 1200px; margin: 0 auto;
  }

  @media (max-width: 600px) {
    nav { gap: 8px; }
    nav a { font-size: 0.75rem; padding: 4px 6px; }
    .page-title { font-size: 1.5rem; letter-spacing: 2px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>

<style id="spoiler-portrait-gate">
/* L18+L20: Silhouette character portraits + bounty poster images for users
   who haven't caught up. The portrait files themselves are post-timeskip /
   Egghead-era visuals; rendering them at low cutoff leaks the timeskip and
   late-arc evolution. brightness(0) blacks out the image content while
   preserving its layout box, giving a clean silhouette feel. Caught-up
   readers see the originals as intended. */
html[data-spoiler-silhouette="1"] .char-portrait img,
html[data-spoiler-silhouette="1"] .poster-portrait img,
html[data-spoiler-silhouette="1"] .poster-art img,
html[data-spoiler-silhouette="1"] img.char-img,
html[data-spoiler-silhouette="1"] img.bounty-img {
  content: url('assets/silhouettes/generic-character-v02.jpg') !important; object-fit: cover !important;
  opacity: 0.55 !important;
}
html[data-spoiler-silhouette="1"] .char-portrait::after,
html[data-spoiler-silhouette="1"] .poster-portrait::after {
  content: "🛡 silhouette";
  position: absolute; bottom: 2px; right: 2px;
  font-size: 0.62rem; color: #6a9ec8;
  background: rgba(26,22,16,0.7); padding: 1px 5px;
  border-radius: 3px; pointer-events: none;
}
</style>

<script src="spoiler.js?v=1"></script>
<script>
  const RAW = JSON.parse(document.getElementById("punk-records-data").textContent);
  const PORTRAITS = JSON.parse(document.getElementById("portraits-data").textContent);

  // Sort by appearance count desc by default — most prominent first
  let currentSort = "appearances";
  function bountyValue(c) {
    if (typeof c.bounty_value === "number") return c.bounty_value;
    const m = (c.bounty || "").match(/[\d,]+/);
    return m ? parseInt(m[0].replace(/,/g, ""), 10) || 0 : 0;
  }
  function debutChapter(c) {
    if (typeof c.first_appearance_chapter === "number") return c.first_appearance_chapter;
    const m = (c.first_appearance || "").match(/Chapter\s+(\d+)/);
    return m ? parseInt(m[1], 10) : 99999;
  }
  function sortFn(a, b) {
    switch (currentSort) {
      case "appearances": return (b.appearances || 0) - (a.appearances || 0);
      case "alpha":       return (a.name || "").localeCompare(b.name || "");
      case "alpha-rev":   return (b.name || "").localeCompare(a.name || "");
      case "bounty":      return bountyValue(b) - bountyValue(a);
      case "debut":       return debutChapter(a) - debutChapter(b);
      case "debut-rev":   return debutChapter(b) - debutChapter(a);
      default: return 0;
    }
  }
  // Spoiler Shield: filter the index to characters whose debut chapter ≤
  // the user's effective cutoff. Pagination filters the source pool — we
  // don't surface "X of Y filtered out" because the count itself is a
  // spoiler ('there are 200 characters past your cutoff').
  const _charsCutoff = (typeof CodexSpoiler !== 'undefined')
    ? CodexSpoiler.effectiveCutoff('public') : Infinity;
  const ALL = RAW.slice()
    .filter(c => debutChapter(c) <= _charsCutoff)
    .sort(sortFn);

  let currentFilter = "all";
  let currentQuery  = "";

  const STRAWHATS = new Set([
    "Monkey D. Luffy", "Roronoa Zoro", "Nami", "Sanji",
    "Usopp", "Tony Tony Chopper", "Nico Robin", "Franky", "Brook", "Jinbe",
  ]);

  function passesFilter(c) {
    switch (currentFilter) {
      case "bounty":   return !!c.bounty;
      case "df":       return !!c.devil_fruit_name;
      case "strawhat": return STRAWHATS.has(c.name);
      case "major":    return (c.appearances || 0) >= 50;
      default: return true;
    }
  }

  function passesSearch(c) {
    if (!currentQuery) return true;
    const q = currentQuery.toLowerCase();
    return (c.name || "").toLowerCase().includes(q)
        || (c.epithet || "").toLowerCase().includes(q)
        || (c.affiliation || "").toLowerCase().includes(q)
        || (c.devil_fruit_name || "").toLowerCase().includes(q)
        || (c.occupation || "").toLowerCase().includes(q);
  }

  function render() {
    const filtered = ALL.slice().sort(sortFn).filter(c => passesFilter(c) && passesSearch(c));
    const stats = document.getElementById("stats");
    stats.innerHTML = `Showing <strong>${filtered.length.toLocaleString()}</strong> of <strong>${ALL.length.toLocaleString()}</strong> characters`;

    const grid = document.getElementById("grid");
    if (!filtered.length) {
      grid.innerHTML = `<div class="empty">No characters match — try a broader search.</div>`;
      return;
    }
    // Cap initial render at 200 for perf — search/filter narrows quickly
    const slice = filtered.slice(0, 200);
    grid.innerHTML = slice.map(c => {
      const meta = [];
      if (c.appearances) meta.push(`${c.appearances} appearance${c.appearances === 1 ? "" : "s"}`);
      if (c.bounty)            meta.push("bounty");
      if (c.devil_fruit_name)  meta.push("Devil Fruit");
      if (c.haki)              meta.push("haki");
      const url = c.chr_id ? "character.html?id=" + encodeURIComponent(c.chr_id) : "character.html?name=" + encodeURIComponent(c.name);
      const portrait = PORTRAITS[c.name];
      const initial = (c.name || "?").trim().charAt(0).toUpperCase();
      const portraitHTML = portrait
        ? `<img src="${escapeHTML(portrait)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`
        : "";
      const richFields = ['height','age','birthday','bounty','devil_fruit_name','blood_type','origin'].filter(f => c[f]);
      const qClass = richFields.length >= 4 ? "q-rich" : richFields.length >= 2 ? "q-std" : "q-min";
      const qTitle = richFields.length >= 4 ? "Rich data" : richFields.length >= 2 ? "Standard data" : "Minimal data";
      return `<a class="char-card" href="${url}">
        <div class="char-portrait" data-initial="${escapeHTML(initial)}" data-form-character="${escapeHTML(c.name)}" data-form-compact="1">${portraitHTML}</div>
        <div class="char-text">
          <span class="char-name">${escapeHTML(c.name)}</span>
          ${c.epithet ? `<span class="char-epithet">${escapeHTML(c.epithet)}</span>` : ""}
          <div class="char-meta">${meta.map(m => `<span>${m}</span>`).join("")}<span class="char-quality ${qClass}" title="${qTitle} (${richFields.length}/7 fields)"></span></div>
        </div>
      </a>`;
    }).join("");
    if (filtered.length > slice.length) {
      grid.innerHTML += `<div class="empty" style="grid-column:1/-1">+ ${filtered.length - slice.length} more — refine your search to see them.</div>`;
    }
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }

  document.getElementById("search").addEventListener("input", e => {
    currentQuery = e.target.value.trim();
    render();
  });

  document.getElementById("sort").addEventListener("change", e => {
    currentSort = e.target.value;
    render();
  });

  document.querySelectorAll(".filter-pill[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filter-pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>

<script>
// L18+L20 portrait silhouette gate. Sets data-spoiler-silhouette="1" on
// <html> when the user's cutoff is less than LATEST_PUBLISHED_CHAPTER.
// CSS rule above handles the silhouette via brightness(0). Re-runs on
// CodexSpoiler.onChange so toggling caught-up flips the silhouette live.
(function () {
  function _spoilerSilCutoff() {
    if (typeof CodexSpoiler !== 'undefined' && CodexSpoiler.snapshot) {
      const ch = CodexSpoiler.snapshot().cutoff_chapter || 0;
      return ch >= 1181 ? 1181 : ch;
    }
    try {
      const raw = JSON.parse(localStorage.getItem('codex-spoiler-state') || 'null');
      const ch = raw && raw.cutoff_chapter || parseInt(localStorage.getItem('spoilerCutoff') || '0', 10);
      return Math.min(Math.max(ch || 0, 0), ((window.CodexSpoiler && CodexSpoiler.LATEST_PUBLISHED_CHAPTER) || 1188));
    } catch (_) { return 0; }
  }
  function _applySilhouette() {
    const ch = _spoilerSilCutoff();
    if (ch >= 1181 || ch === 0) {
      document.documentElement.removeAttribute('data-spoiler-silhouette');
    } else {
      document.documentElement.setAttribute('data-spoiler-silhouette', '1');
    }
  }
  _applySilhouette();
  function _wireOnChange() {
    if (typeof CodexSpoiler !== 'undefined' && CodexSpoiler.onChange) {
      CodexSpoiler.onChange(_applySilhouette);
    } else { setTimeout(_wireOnChange, 100); }
  }
  _wireOnChange();
})();
