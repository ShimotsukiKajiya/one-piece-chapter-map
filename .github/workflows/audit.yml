name: Daily audit

# Runs the read-only sanity check every day. If it finds any 🔴 ERROR-level
# issue, opens a GitHub Issue so the maintainer is notified. WARN/INFO
# findings are uploaded as an artefact but don't trigger an Issue (they're
# noise-level on a healthy run).
#
# Manual button: Actions tab → "Daily audit" → Run workflow

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"   # daily 07:00 UTC

permissions:
  contents: read       # only reads the repo
  issues:   write      # may file an issue if errors are found

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run audit (capture exit code)
        id: audit
        continue-on-error: true
        run: |
          set +e
          python audit.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # ── Spoiler Shield checks ────────────────────────────────────────
      # audit.py checks the data is coherent. These check the SHIELD:
      #   D2 leak behaviour — does a reader see something they shouldn't?
      #   D3 blankness      — can a reader reach a page that shows nothing?
      # Both are pure-Python (gating is data-driven), so no browser needed.
      # Any failure feeds the same issue-filing step as the main audit.
      - name: Lexicon in sync with lore-gate.js
        id: lexicon
        continue-on-error: true
        run: |
          set +e
          python scripts/sync_lexicon.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Every lore entry has a gate chapter
        id: gatecov
        continue-on-error: true
        run: |
          set +e
          python scripts/derive_gate_chapters.py | tee /tmp/derive.txt
          grep -q "Every entry has a gate chapter" /tmp/derive.txt
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: D2 — leak behaviour
        id: leaks
        continue-on-error: true
        run: |
          set +e
          python scripts/audit_leak_behaviour.py --verbose
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: D3 — blankness
        id: blank
        continue-on-error: true
        run: |
          set +e
          python scripts/audit_blankness.py --table
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Fail the job if any shield check failed
        if: >
          steps.lexicon.outputs.rc != '0' ||
          steps.gatecov.outputs.rc != '0' ||
          steps.leaks.outputs.rc  != '0' ||
          steps.blank.outputs.rc  != '0'
        run: |
          echo "::error::Spoiler Shield check failed —" \
               "lexicon=${{ steps.lexicon.outputs.rc }}" \
               "gate-coverage=${{ steps.gatecov.outputs.rc }}" \
               "leaks=${{ steps.leaks.outputs.rc }}" \
               "blankness=${{ steps.blank.outputs.rc }}"
          exit 1

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: docs/audit_report.md
          if-no-files-found: warn

      - name: File issue on errors (with dedup)
        if: steps.audit.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dedup: if there's already an open audit issue, comment on it
          # instead of opening a new one. Prevents inbox flood when audit
          # has been failing for multiple consecutive days.
          BODY=$(head -n 60 docs/audit_report.md)
          DATE=$(date -u +%Y-%m-%d)
          EXISTING=$(gh issue list --label "audit" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            COMMENT=$(printf "🔴 **Audit still failing on %s**\n\n%s" "$DATE" "$BODY")
            gh issue comment "$EXISTING" --body "$COMMENT"
          else
            gh issue create \
              --title "🔴 Daily audit found errors $DATE" \
              --body "$BODY" \
              --label "audit,needs-review"
          fi
