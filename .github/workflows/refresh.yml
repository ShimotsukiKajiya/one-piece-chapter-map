name: Refresh Codex data

# Runs daily. Scheduled runs pick their own mode:
#   Mon-Sat  -> quick  (chapter probe + light scrapers, ~5 min; a new
#                       chapter lands on the site within a day of its
#                       wiki page appearing)
#   Sunday   -> full   (everything incl. Punk Records + SBS images,
#                       ~25 min; new characters get their infobox
#                       records/portraits weekly)
# Manual runs via the Actions tab can force any mode.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        type: choice
        default: "quick"
        options:
          - quick      # fast: skips Punk Records + SBS images
          - full       # everything (~25 min)
          - audit-only # just sanity-check existing data, no scraping
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC; Sunday runs upgrade to full

concurrency:
  group: refresh-codex
  cancel-in-progress: false

# Only the GITHUB_TOKEN that this workflow auto-receives is used. No secrets
# are required for the default flow. ANTHROPIC_API_KEY is optional — set it
# as a repo secret if you want sbs_categorizer.py / theory_analyzer.py to
# run in CI; otherwise refresh.py skips them gracefully.
permissions:
  contents: write     # needed so the workflow can commit + push refreshed data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # full history so we can push back
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Optional — only used if you've added it as a repo secret.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ inputs.mode }}"
          # Scheduled runs have no inputs — pick mode by weekday:
          # Sunday gets the full pipeline (Punk Records + SBS images),
          # weekdays get the fast chapter probe.
          if [ -z "$MODE" ]; then
            if [ "$(date -u +%u)" = "7" ]; then MODE=full; else MODE=quick; fi
          fi
          echo "Pipeline mode: $MODE"
          case "$MODE" in
            audit-only) python audit.py ;;
            full)       python refresh.py ;;
            quick|*)    python refresh.py --quick ;;
          esac

      - name: Commit + push refreshed data
        if: ${{ inputs.mode != 'audit-only' }}
        run: |
          git config user.name  "shimotsuki-codex-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage each refreshed output individually — a single missing path
          # must not abort staging of the rest (this bug froze the site's
          # data at Ch.1181 from launch until 2026-07-12).
          # Data files the scrapers/cleaners rewrite:
          for f in appearances.csv sbs_archive.json theories_import.json \
                   volume_covers.json cover_stories.json punk_records.json \
                   canon_facts.json character_forms.json portraits.json \
                   chr-debut-map.json chapter_dates.json spoiler.js; do
            git add -- "$f" 2>/dev/null || echo "  (skip: $f not present)"
          done
          # Baked site output — bake.py rewrites data blocks inside the
          # HTML pages themselves; without this the live pages go stale
          # even when the JSON is fresh.
          git add -- '*.html' 2>/dev/null || true
          echo "--- staged changes ---"
          git diff --cached --stat | tail -15
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "chore(data): scheduled refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: docs/audit_report.md
          if-no-files-found: ignore
