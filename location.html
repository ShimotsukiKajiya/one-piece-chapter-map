<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0c0a14;--surface:#1a1610;--surface2:#251f15;--border:#4a3820;--text:#e8d8b0;--muted:#8a7548;--gold:#d4a44a;--gold-bright:#f5c95e;--ink-blue:#6a9ec8}
  body{background:radial-gradient(circle at 25% 15%,rgba(212,164,74,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:14px 14px;pointer-events:none;z-index:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:rgba(26,22,16,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
  .logo{text-decoration:none;color:inherit}
  .logo h1{font-size:1.4rem;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  nav a{color:var(--text);text-decoration:none;font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;padding:6px 10px;border-radius:6px}
  nav a:hover,nav a.active{color:var(--gold-bright);background:var(--surface2)}
  main{max-width:900px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:1}
  .crumbs{color:var(--muted);font-size:.8rem;margin-bottom:16px}
  .crumbs a{color:var(--ink-blue);text-decoration:none}
  .head{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:24px 28px;margin-bottom:22px}
  .head{display:flex;gap:20px;align-items:flex-start}
  .loc-portrait-wrap{flex-shrink:0;width:120px;aspect-ratio:1/1;border-radius:10px;border:2px solid var(--border);background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:2.8rem;font-weight:900;color:var(--muted);position:relative}
  .loc-portrait-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:9px}
  .loc-info{flex:1;min-width:0}
  .name{font-size:2rem;font-weight:900;color:var(--gold-bright)}
  .name-jp{color:var(--muted);font-size:1rem;margin-top:4px}
  .name-en{font-style:italic;color:var(--ink-blue);margin-top:6px}
  .quick{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;color:var(--muted);font-size:.9rem}
  .quick strong{color:var(--text)}
  .sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px}
  .section h3{color:var(--gold);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .field{display:flex;gap:12px;margin-bottom:10px}
  .field-label{color:var(--muted);font-size:.78rem;letter-spacing:1px;text-transform:uppercase;min-width:100px;flex-shrink:0}
  .field-value{color:var(--text);font-size:.95rem;line-height:1.5}
  .not-found{text-align:center;padding:60px 24px;border:1px dashed var(--border);border-radius:12px}
  .not-found h2{color:var(--gold);margin-bottom:12px}
  .not-found a{display:inline-block;margin-top:18px;background:var(--gold);color:var(--bg);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}
  footer{padding:30px 24px 50px;text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:1px;border-top:1px solid var(--border);max-width:900px;margin:0 auto}
</style>

<script>
const RAW=JSON.parse(document.getElementById("locations-data").textContent||"{}");
const SHARDS=JSON.parse(document.getElementById("location-shards-data").textContent||"{}");
// Build id→name reverse map for ?id= routing
const BY_ID={};
Object.values(RAW).forEach(l=>{if(l&&l.id)BY_ID[l.id]=l.name});
const params=new URLSearchParams(location.search);
const idParam=params.get("id");
const requested=idParam?BY_ID[idParam]:params.get("name");
const root=document.getElementById("root");
function escapeHTML(s){if(s==null)return"";return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function locImgUrl(img){if(!img)return null;img=img.trim().replace(/^File:/i,"");if(!img||/^\d+px$/.test(img)||img.length<4)return null;return"https://onepiece.fandom.com/wiki/Special:FilePath/"+encodeURIComponent(img)}
if(!requested){root.innerHTML=`<div class="not-found"><h2>No location requested</h2><a href="locations.html">← Browse all locations</a></div>`}
else{const l=RAW[requested];if(!l){root.innerHTML=`<div class="not-found"><h2>No record for "${escapeHTML(requested)}"</h2><a href="locations.html">← Browse all locations</a></div>`}
else{document.title=`${l.name} · Location · The Shimotsuki Codex`;
  const quick=[];
  if(l.region)quick.push(`<span><strong>Region:</strong> ${escapeHTML(l.region)}</span>`);
  if(l.first_appearance)quick.push(`<span><strong>Debut:</strong> ${escapeHTML(l.first_appearance)}</span>`);
  if(l.status)quick.push(`<span><strong>Status:</strong> ${escapeHTML(l.status)}</span>`);
  const ident=[["English",l.name_en],["Japanese",l.name_jp],["Romanised",l.name_romaji],["Region",l.region],["Type",l.type]].filter(([_,v])=>v).map(([k,v])=>`<div class="field"><div class="field-label">${k}</div><div class="field-value">${escapeHTML(v)}</div></div>`).join("");
  const polit=[["Affiliation",l.affiliation],["Ruler",l.ruler||l.leader],["Inhabitants",l.inhabitants],["Industries",l.industries],["Population",l.population]].filter(([_,v])=>v).map(([k,v])=>`<div class="field"><div class="field-label">${k}</div><div class="field-value">${escapeHTML(v)}</div></div>`).join("");
  root.innerHTML=`
    <div class="crumbs"><a href="home.html">Home</a> › <a href="locations.html">Locations</a> › <span>${escapeHTML(l.name)}</span></div>
    <div class="head">
      ${(()=>{const url=locImgUrl(l.infobox_image);return url?`<div class="loc-portrait-wrap">${escapeHTML(l.name[0])}<img src="${url}" alt="${escapeHTML(l.name)}" onerror="this.style.display='none'"></div>`:"";})()}
      <div class="loc-info">
        <div class="name">${escapeHTML(l.name)}</div>
        ${l.name_jp?`<div class="name-jp">${escapeHTML(l.name_jp)}</div>`:""}
        ${l.name_en&&l.name_en!==l.name?`<div class="name-en">"${escapeHTML(l.name_en)}"</div>`:""}
        ${quick.length?`<div class="quick">${quick.join("")}</div>`:""}
      </div>
    </div>
    <div class="sections">
      ${ident?`<div class="section"><h3>Identity</h3>${ident}</div>`:""}
      ${polit?`<div class="section"><h3>Inhabitants &amp; Politics</h3>${polit}</div>`:""}
      ${renderShardSections(l.id)}
    </div>`;
}}
function escapeHTMLloc(s){if(s==null)return"";return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chrLink(id,label){return`<a class="entity-link" href="character.html?id=${encodeURIComponent(id)}">${escapeHTMLloc(label||id)}</a>`}
function arcLink(arcId,label){return`<a class="entity-link" href="arc.html?id=${encodeURIComponent(arcId)}">${escapeHTMLloc(label||arcId)}</a>`}
function renderShardSections(locId){
  const s=SHARDS[locId];
  if(!s)return"";
  const parts=[];
  if(s.arcs&&s.arcs.length){
    const rows=s.arcs.map(r=>`<div class="field"><div class="field-value">${escapeHTMLloc(r._display||r.from)}</div></div>`).join("");
    parts.push(`<div class="section"><h3>Story Arcs Set Here</h3>${rows}</div>`);
  }
  if(s.born_here&&s.born_here.length){
    const MAX=30;
    const shown=s.born_here.slice(0,MAX);
    const more=s.born_here.length>MAX?`<div class="field" style="color:var(--muted);font-size:0.85em">… and ${s.born_here.length-MAX} more characters</div>`:"";
    const rows=shown.map(r=>`<div class="field"><div class="field-value">${chrLink(r.from,r._display)}</div></div>`).join("");
    parts.push(`<div class="section"><h3>Characters Born Here <span style="color:var(--muted);font-size:0.85em">(${s.born_here.length})</span></h3>${rows}${more}</div>`);
  }
  return parts.join("");
}
