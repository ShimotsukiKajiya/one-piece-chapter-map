<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0c0a14;--surface:#1a1610;--surface2:#251f15;--border:#4a3820;--text:#e8d8b0;--muted:#8a7548;--gold:#d4a44a;--gold-bright:#f5c95e;--ink-blue:#6a9ec8}
  body{background:radial-gradient(circle at 25% 15%,rgba(212,164,74,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.012) 1px,transparent 1px);background-size:14px 14px;pointer-events:none;z-index:0}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:rgba(26,22,16,.7);backdrop-filter:blur(6px);position:sticky;top:0;z-index:50}
  .logo{text-decoration:none;color:inherit}
  .logo h1{font-size:1.4rem;font-weight:900;letter-spacing:3px;background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{font-size:.7rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  nav a{color:var(--text);text-decoration:none;font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;padding:6px 10px;border-radius:6px}
  nav a:hover,nav a.active{color:var(--gold-bright);background:var(--surface2)}
  main{max-width:900px;margin:0 auto;padding:32px 24px 80px;position:relative;z-index:1}
  .crumbs{color:var(--muted);font-size:.8rem;margin-bottom:16px}
  .crumbs a{color:var(--ink-blue);text-decoration:none}
  .head{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:14px;padding:24px 28px;margin-bottom:22px}
  .name{font-size:2rem;font-weight:900;color:var(--gold-bright)}
  .name-jp{color:var(--muted);font-size:1rem;margin-top:4px}
  .name-en{font-style:italic;color:var(--ink-blue);margin-top:6px}
  .quick{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;color:var(--muted);font-size:.9rem}
  .quick strong{color:var(--text)}
  .quick a{color:var(--ink-blue);text-decoration:none;border-bottom:1px dotted var(--ink-blue)}
  .quick a:hover{color:var(--gold-bright)}
  .sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 22px}
  .section h3{color:var(--gold);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .field{display:flex;gap:12px;margin-bottom:10px}
  .field-label{color:var(--muted);font-size:.78rem;letter-spacing:1px;text-transform:uppercase;min-width:100px;flex-shrink:0}
  .field-value{color:var(--text);font-size:.95rem;line-height:1.5}
  .field-value a{color:var(--ink-blue);text-decoration:none;border-bottom:1px dotted var(--ink-blue)}
  .field-value a:hover{color:var(--gold-bright)}
  .not-found{text-align:center;padding:60px 24px;border:1px dashed var(--border);border-radius:12px}
  .not-found h2{color:var(--gold);margin-bottom:12px}
  .not-found a{display:inline-block;margin-top:18px;background:var(--gold);color:var(--bg);padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}
  footer{padding:30px 24px 50px;text-align:center;font-size:.75rem;color:var(--muted);letter-spacing:1px;border-top:1px solid var(--border);max-width:900px;margin:0 auto}
</style>

<script>
const RAW=JSON.parse(document.getElementById("ships-data").textContent||"{}");
const SAILS=JSON.parse(document.getElementById("ship-sails-data").textContent||"{}");
// Build a ship:NNNNN → record index for ?id= routing
const BY_ID={};
for(const s of Object.values(RAW)){if(s&&s.id)BY_ID[s.id]=s;}
const params=new URLSearchParams(location.search);
const root=document.getElementById("root");
// Support ?id=ship:NNNNN (new) or ?name=ShipName (legacy)
let ship=null;
const reqId=params.get("id"),reqName=params.get("name");
if(reqId) ship=BY_ID[reqId]||null;
else if(reqName) ship=RAW[reqName]||null;

function escapeHTML(s){if(s==null)return"";return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chrLink(id,name){if(!id)return escapeHTML(name||"");return`<a class="entity-link" href="character.html?id=${encodeURIComponent(id)}">${escapeHTML(name||id)}</a>`}
function linkChars(s){if(!s)return"";return s.split(/[·;]/).map(p=>{const t=p.trim();if(!t)return"";return`<a href="character.html?name=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`}).filter(Boolean).join(" · ")}

function renderCrewSection(shipId){
  const rows=SAILS[shipId];
  if(!rows||!rows.length) return"";
  const current=rows.filter(r=>r.current!==false);
  const former=rows.filter(r=>r.current===false);
  let html="";
  if(current.length){
    html+=`<div class="section"><h3>Crew (${current.length})</h3>`;
    html+=current.map(r=>`<div class="field"><div class="field-value">${chrLink(r.from,r._display)}</div></div>`).join("");
    html+="</div>";
  }
  if(former.length){
    html+=`<div class="section"><h3>Former Crew (${former.length})</h3>`;
    html+=former.map(r=>`<div class="field"><div class="field-value" style="opacity:0.7">${chrLink(r.from,r._display)}</div></div>`).join("");
    html+="</div>";
  }
  return html;
}

// L8 fix: refuse-render gate. Parse ship's first_appearance chapter
// and shield the page if the ship debuts past the user's cutoff. Reads
// localStorage directly so it fires before spoiler.js loads.
function _shipDebutCh(s){
  if(typeof s.first_appearance==="string"){
    const m=s.first_appearance.match(/Chapter\s*(\d+)/i);
    if(m)return parseInt(m[1],10);
  }
  return null;
}
function _shipBootCutoff(){
  try{
    const raw=JSON.parse(localStorage.getItem("codex-spoiler-state")||"null");
    if(raw&&typeof raw.cutoff_chapter==="number"&&raw.cutoff_chapter>0)return Math.min(raw.cutoff_chapter,1188);
    const legacy=parseInt(localStorage.getItem("spoilerCutoff")||"0",10);
    if(legacy>0)return Math.min(legacy,1181);
  }catch(_){}
  return 597;
}
function _shipUnlocked(name){
  try{const raw=JSON.parse(localStorage.getItem("codex-spoiler-state")||"null");return!!(raw&&raw.unlocked&&raw.unlocked[name]===true)}catch(_){return false}
}
function _shipShield(s,debut,eff){
  document.title="Hidden by Spoiler Guard · Ships";
  return`<div class="crumbs"><a href="home.html">Home</a> › <a href="ships.html">Ships</a> › <span style="color:var(--muted);font-style:italic">Hidden ship</span></div>
    <section class="spoiler-banner" style="padding:24px 28px;border-radius:14px;border:1px solid var(--border);border-left:4px solid #6a9ec8;background:linear-gradient(135deg,#1a1610 0%,#251f15 100%);margin:18px 0">
      <h2 style="color:#f5c95e;letter-spacing:2px;font-size:1.05rem;margin-bottom:10px;text-transform:uppercase">🛡 Hidden by Spoiler Guard</h2>
      <p style="line-height:1.6;color:#e8d8b0;margin-bottom:14px">This ship debuts in <strong>Chapter ${debut}</strong>, past your reading point (Ch.&nbsp;<strong>${eff}</strong>). The full profile would spoil its existence.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="window.codexSettings && window.codexSettings.open()" style="background:var(--surface2);color:var(--gold);border:1px solid var(--border);padding:9px 18px;border-radius:6px;cursor:pointer;font:inherit">⚙ Adjust shield</button>
        <button onclick="(function(){try{var st=JSON.parse(localStorage.getItem('codex-spoiler-state')||'{}');st.unlocked=st.unlocked||{};st.unlocked[${JSON.stringify(s.name)}]=true;localStorage.setItem('codex-spoiler-state',JSON.stringify(st))}catch(_){};location.reload()})()" style="background:var(--surface2);color:var(--ink-blue);border:1px solid var(--border);padding:9px 18px;border-radius:6px;cursor:pointer;font:inherit">👁 Reveal anyway (this ship only)</button>
        <a href="ships.html" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);padding:9px 18px;border-radius:6px;text-decoration:none;display:inline-flex;align-items:center">← Back to all ships</a>
      </div>
    </section>`;
}

if(!ship){
  const label=reqId||reqName;
  root.innerHTML=label
    ?`<div class="not-found"><h2>No record for "${escapeHTML(label)}"</h2><a href="ships.html">← Browse all ships</a></div>`
    :`<div class="not-found"><h2>No ship requested</h2><a href="ships.html">← Browse all ships</a></div>`;
}else{
  const s=ship;
  // L8 gate
  const _shipDebut=_shipDebutCh(s);
  const _shipEff=_shipBootCutoff();
  if(_shipDebut&&_shipDebut>_shipEff&&!_shipUnlocked(s.name)){
    root.innerHTML=_shipShield(s,_shipDebut,_shipEff);
  }else{
  document.title=`${s.name} · Ship · The Shimotsuki Codex`;
  const quick=[];
  if(s.captain)quick.push(`<span><strong>Captain:</strong> ${linkChars(s.captain)}</span>`);
  if(s.affiliation)quick.push(`<span><strong>Crew:</strong> ${escapeHTML(s.affiliation)}</span>`);
  if(s.first_appearance)quick.push(`<span><strong>Debut:</strong> ${escapeHTML(s.first_appearance)}</span>`);
  const ident=[["English",s.name_en],["Japanese",s.name_jp],["Romanised",s.name_romaji],["Type",s.type],["Classification",s.classification],["Status",s.status]]
    .filter(([,v])=>v&&v!=="N/A").map(([k,v])=>`<div class="field"><div class="field-label">${k}</div><div class="field-value">${escapeHTML(v)}</div></div>`).join("");
  const crewMeta=[["Captain",linkChars(s.captain),true],["Affiliation",s.affiliation,false],["Shipwright",linkChars(s.shipwright),true]]
    .filter(([,v])=>v).map(([k,v,raw])=>`<div class="field"><div class="field-label">${k}</div><div class="field-value">${raw?v:escapeHTML(v)}</div></div>`).join("");
  root.innerHTML=`
    <div class="crumbs"><a href="home.html">Home</a> › <a href="ships.html">Ships</a> › <span>${escapeHTML(s.name)}</span></div>
    <div class="head">
      <div class="name">${escapeHTML(s.name)}</div>
      ${s.name_jp?`<div class="name-jp">${escapeHTML(s.name_jp)}</div>`:""}
      ${s.name_en&&s.name_en!==s.name&&s.name_en!=="N/A"?`<div class="name-en">"${escapeHTML(s.name_en)}"</div>`:""}
      ${quick.length?`<div class="quick">${quick.join("")}</div>`:""}
    </div>
    <div class="sections">
      ${ident?`<div class="section"><h3>Identity</h3>${ident}</div>`:""}
      ${crewMeta?`<div class="section"><h3>Affiliation</h3>${crewMeta}</div>`:""}
      ${renderCrewSection(s.id)}
    </div>`;
  }  // close L8 gate else
}
</script>

<script>
  // Spoiler Shield: page-scoped soft gate. Reads effective cutoff so the
  // page can later add filter logic via this hook. Currently a no-op for
  // pages whose data shape needs more work to gate (LORE essays mostly
  // pass through but character link lists are filtered by chr-link-upgrader).
  if (typeof CodexSpoiler !== "undefined") {
    var _pageCutoff = CodexSpoiler.effectiveCutoff("public");
    document.documentElement.dataset.spoilerCutoff = _pageCutoff;
  }
</script>
