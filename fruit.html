<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg:#0c0a14; --surface:#1a1610; --surface2:#251f15;
    --border:#4a3820; --text:#e8d8b0; --muted:#8a7548;
    --gold:#d4a44a; --gold-bright:#f5c95e; --ink-blue:#6a9ec8;
    --paramecia:#c8649c; --logia:#e85c3c; --zoan:#7cb35f;
    --mythical:#b07cd1; --ancient:#d4a44a;
  }
  body {
    background: radial-gradient(circle at 25% 15%, rgba(212,164,74,0.05) 0%, transparent 50%), var(--bg);
    color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background-image: radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size:14px 14px; pointer-events:none; z-index:0;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--border);
    background:rgba(26,22,16,0.7); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:50;
  }
  .logo { text-decoration:none; color:inherit; }
  .logo h1 {
    font-size:1.4rem; font-weight:900; letter-spacing:3px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .logo-sub { font-size:0.7rem; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  nav { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  nav a { color:var(--text); text-decoration:none; font-size:0.85rem; letter-spacing:1.5px; text-transform:uppercase; padding:6px 10px; border-radius:6px; }
  nav a:hover, nav a.active { color:var(--gold-bright); background:var(--surface2); }

  main { max-width:900px; margin:0 auto; padding:32px 24px 80px; position:relative; z-index:1; }

  .crumbs { color:var(--muted); font-size:0.8rem; margin-bottom:16px; }
  .crumbs a { color:var(--ink-blue); text-decoration:none; }
  .crumbs a:hover { color:var(--gold-bright); }

  .head {
    background:linear-gradient(180deg, var(--surface2), var(--surface));
    border:1px solid var(--border); border-left:4px solid var(--gold);
    border-radius:14px; padding:24px 28px; margin-bottom:22px;
    display:flex; gap:22px; align-items:flex-start;
  }
  .fruit-portrait-wrap {
    flex-shrink:0; width:120px; aspect-ratio:1/1;
    border-radius:10px; border:2px solid var(--border);
    background:var(--surface); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-size:2.8rem; font-weight:900; color:var(--muted);
    position:relative;
  }
  .fruit-portrait-wrap img {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; border-radius:9px;
  }
  .fruit-info { flex:1; min-width:0; }
  .head.paramecia { border-left-color:var(--paramecia); }
  .head.logia     { border-left-color:var(--logia); }
  .head.zoan      { border-left-color:var(--zoan); }
  .head.mythical  { border-left-color:var(--mythical); }
  .head.ancient   { border-left-color:var(--ancient); }

  .name { font-size:2rem; font-weight:900; color:var(--gold-bright); }
  .name-jp { color:var(--muted); font-size:1rem; margin-top:4px; font-family:'Yu Mincho','MS Mincho',serif; }
  .name-en { font-style:italic; color:var(--ink-blue); margin-top:6px; }
  .quick { display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; color:var(--muted); font-size:0.9rem; }
  .quick strong { color:var(--text); }

  .type-badge {
    display:inline-block; padding:3px 10px; border-radius:6px;
    font-size:0.72rem; letter-spacing:1.5px; text-transform:uppercase;
    font-weight:700; margin-top:8px;
  }
  .type-badge.paramecia { background:rgba(200,100,156,0.15); color:var(--paramecia); border:1px solid rgba(200,100,156,0.4); }
  .type-badge.logia     { background:rgba(232,92,60,0.15);   color:var(--logia);     border:1px solid rgba(232,92,60,0.4); }
  .type-badge.zoan      { background:rgba(124,179,95,0.15);  color:var(--zoan);      border:1px solid rgba(124,179,95,0.4); }
  .type-badge.mythical  { background:rgba(176,124,209,0.15); color:var(--mythical);  border:1px solid rgba(176,124,209,0.4); }
  .type-badge.ancient   { background:rgba(212,164,74,0.15);  color:var(--ancient);   border:1px solid rgba(212,164,74,0.4); }

  .sections { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:18px; }
  .section {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:18px 22px;
  }
  .section h3 {
    color:var(--gold); font-size:0.85rem; letter-spacing:2px; text-transform:uppercase;
    font-weight:700; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .field { display:flex; gap:12px; margin-bottom:10px; align-items:flex-start; }
  .field-label { color:var(--muted); font-size:0.78rem; letter-spacing:1px; text-transform:uppercase; min-width:100px; flex-shrink:0; }
  .field-value { color:var(--text); font-size:0.95rem; line-height:1.5; }
  .field-value a { color:var(--ink-blue); text-decoration:none; border-bottom:1px dotted var(--ink-blue); }
  .field-value a:hover { color:var(--gold-bright); }

  .not-found { text-align:center; padding:60px 24px; border:1px dashed var(--border); border-radius:12px; }
  .entity-link { color:var(--ink-blue); text-decoration:none; border-bottom:1px dotted var(--ink-blue); }
  .entity-link:hover { color:var(--gold-bright); border-color:var(--gold-bright); }
  .not-found h2 { color:var(--gold); margin-bottom:12px; }
  .not-found a { display:inline-block; margin-top:18px; background:var(--gold); color:var(--bg); padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:700; }

  footer { padding:30px 24px 50px; text-align:center; font-size:0.75rem; color:var(--muted); letter-spacing:1px; border-top:1px solid var(--border); max-width:900px; margin:0 auto; }
</style>

// ── BOOT-SAFE SPOILER HELPERS ───────────────────────────────────────────
// This script runs BEFORE spoiler.js loads (script order in this file).
// Read localStorage directly so we can gate first render correctly.
// Mirrors character.html's _bootEffectiveCutoff / _isCaughtUp pattern.
const _LATEST_CH = 1188;
function _bootCutoff() {
  try {
    const raw = JSON.parse(localStorage.getItem("codex-spoiler-state") || "null");
    if (raw && typeof raw.cutoff_chapter === "number" && raw.cutoff_chapter > 0) {
      return Math.max(0, Math.min(raw.cutoff_chapter, _LATEST_CH));
    }
  } catch (_) {}
  const legacy = parseInt(localStorage.getItem("spoilerCutoff") || "0", 10);
  if (legacy > 0) return Math.max(0, Math.min(legacy, _LATEST_CH));
  return 597;  // strict default for first-time visitors (pre-timeskip safe pool)
}
const _CUTOFF = _bootCutoff();
const _CAUGHT_UP = _CUTOFF >= _LATEST_CH;

// Per-fruit reveal_chapter overrides for fruits where the wiki conflates
// pre-reveal and post-reveal data with a "\n----" separator. The override
// records WHEN the post-reveal portion became canon. Without an entry here,
// the page falls back to "show post-reveal portion only when caught up."
//
// Add entries as new late-arc reveals happen. Format: canonical RAW key →
// chapter the post-reveal portion debuted.
const FRUIT_REVEALS = {
  // L17 fix (2026-05-03): auto-derived from devil_fruits.json — every fruit
  // with a "Model: X" pattern needs gating because the model itself is a
  // late-arc reveal. Defaults to current eater's debut chapter; manual
  // override for Gomu Gomu (Nika reveal Ch.1043, not Luffy's Ch.1).
  "Gomu Gomu no Mi": 1043,
  "Batto Batto no Mi, Model: Vampire": 1181,
  "Hebi Hebi no Mi, Model: Anaconda": 516,
  "Hebi Hebi no Mi, Model: King Cobra": 516,
  "Hebi Hebi no Mi, Model: Yamata no Orochi": 927,
  "Hito Hito no Mi, Model: Daibutsu": 234,
  "Hito Hito no Mi, Model: Onyudo": 936,
  "Inu Inu no Mi, Model: Bake-danuki": 1181,
  "Inu Inu no Mi, Model: Dachshund": 160,
  "Inu Inu no Mi, Model: Hound": 1078,
  "Inu Inu no Mi, Model: Jackal": 155,
  "Inu Inu no Mi, Model: Kyubi no Kitsune": 575,
  "Inu Inu no Mi, Model: Okuchi no Makami": 971,
  "Inu Inu no Mi, Model: Tanuki": 911,
  "Inu Inu no Mi, Model: Wolf": 375,
  "Kumo Kumo no Mi, Model: Rosamygale Grauvogeli": 977,
  "Mushi Mushi no Mi, Model: Kabutomushi": 710,
  "Mushi Mushi no Mi, Model: Suzumebachi": 717,
  "Neko Neko no Mi, Model: Leopard": 323,
  "Neko Neko no Mi, Model: Saber Tiger": 977,
  "Ryu Ryu no Mi, Model: Allosaurus": 498,
  "Ryu Ryu no Mi, Model: Brachiosaurus": 920,
  "Ryu Ryu no Mi, Model: Kirin": 1140,
  "Ryu Ryu no Mi, Model: Nidhöggr": 1130,
  "Ryu Ryu no Mi, Model: Pachycephalosaurus": 977,
  "Ryu Ryu no Mi, Model: Pteranodon": 920,
  "Ryu Ryu no Mi, Model: Spinosaurus": 929,
  "Ryu Ryu no Mi, Model: Triceratops": 977,
  "Sara Sara no Mi, Model: Axolotl": 668,
  "Tori Tori no Mi, Model: Albatross": 860,
  "Tori Tori no Mi, Model: Eagle": 1181,
  "Tori Tori no Mi, Model: Falcon": 155,
  "Tori Tori no Mi, Model: Nue": 1181,
  "Tori Tori no Mi, Model: Phoenix": 234,
  "Uma Uma no Mi, Model: Pegasus": 223,
  "Uo Uo no Mi, Model: Seiryu": 921,
  "Ushi Ushi no Mi, Model: Bison": 132,
  "Ushi Ushi no Mi, Model: Giraffe": 323,
  "Zou Zou no Mi, Model: Mammoth": 801,
};
function _isFruitRevealHidden(fruitName) {
  if (_CAUGHT_UP) return false;
  const rc = FRUIT_REVEALS[fruitName];
  if (typeof rc === "number") return rc > _CUTOFF;
  // Unknown reveal chapter for a "\n----"-split field → fail-closed unless caught up
  return true;
}
// Split wiki-concatenated "pre\n----post" strings. If the field has no
// separator, returns {pre: s, post: null, hasReveal: false}. Caller decides
// whether to show post based on cutoff.
function _splitReveal(s) {
  if (typeof s !== "string") return { pre: s, post: null, hasReveal: false };
  const idx = s.indexOf("\n----");
  if (idx < 0) return { pre: s, post: null, hasReveal: false };
  return {
    pre: s.slice(0, idx).trim(),
    post: s.slice(idx + 5).replace(/^[\s-]+/, "").trim(),
    hasReveal: true,
  };
}
// Render a field value, hiding post-reveal portion if appropriate. Returns
// HTML. If post is hidden, includes a [Reveal] tag so the user knows
// something is being held back.
function _safeFieldValue(fruitName, raw) {
  const split = _splitReveal(raw);
  if (!split.hasReveal) return escapeHTML(raw);
  if (!_isFruitRevealHidden(fruitName)) {
    // Show both halves separated by a thin line
    return `${escapeHTML(split.pre)}<span style="color:var(--muted);margin:0 6px">·</span>${escapeHTML(split.post)}`;
  }
  // Hide post; show a small marker
  return `${escapeHTML(split.pre)} <span class="reveal-tag" style="font-size:0.72em;color:var(--muted);font-style:italic;letter-spacing:.5px">[late-arc reveal hidden]</span>`;
}

const RAW = JSON.parse(document.getElementById("fruits-data").textContent || "{}");
const EATERS = JSON.parse(document.getElementById("eaters-data").textContent || "{}");
// Reverse map: fruit:N -> display name (built from id fields in RAW)
const BY_ID = {};
const BY_ALIAS = {};  // alias (lowercase) -> canonical RAW key
for (const [nm, f] of Object.entries(RAW)) {
  if (f && f.id) BY_ID[f.id] = nm;
  // Index all aliases (and the canonical name itself) to the RAW key
  const allNames = [nm, ...(f.aliases || [])];
  for (const a of allNames) { if (a) BY_ALIAS[String(a).toLowerCase()] = nm; }
}
const params = new URLSearchParams(location.search);
const _reqId = params.get("id");
const _rawName = params.get("name");
// Strip " · (alternate name)" or parenthetical suffix that some link sources append.
const _normName = _rawName ? _rawName.split(/\s*[·(]/)[0].trim() : null;
// Resolve: ?id= → BY_ID → RAW key; ?name= → direct key, then alias lookup.
const requested = _reqId ? BY_ID[_reqId]
  : (_normName && (RAW[_normName] ? _normName : BY_ALIAS[_normName.toLowerCase()]));
const root = document.getElementById("root");

function escapeHTML(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fruitImgUrl(f) {
  if (!f.infobox_image) return null;
  const fname = f.infobox_image.replace(/^File:/i, '');
  return 'https://onepiece.fandom.com/wiki/Special:FilePath/' + encodeURIComponent(fname);
}

function typeClass(t) {
  t = (t || "").toLowerCase();
  if (t.includes("ancient"))  return "ancient";
  if (t.includes("mythical")) return "mythical";
  if (t.includes("logia"))    return "logia";
  if (t.includes("zoan"))     return "zoan";
  if (t.includes("paramecia"))return "paramecia";
  return "";
}

function cleanUsers(s) {
  if (!s) return s;
  // Wiki scraper artifact: multi-user infoboxes arrive concatenated, e.g.
  // "Boa HancockS-Snake (Artificial)" or "Kaidou (Natural)Kouzuki Momonosuke
  // (Artificial)". Re-split at the seams so each user renders separately.
  return s
    .replace(/\)(?=[A-Z])/g, ") · ")            // ")Name"  → ") · Name"
    .replace(/([a-z])(S-[A-Z])/g, "$1 · $2");   // "…ockS-Snake" → "…ock · S-Snake"
}

function userLink(s) {
  s = cleanUsers(s);
  if (!s) return "";
  // Split on " · " or ";" and link each segment to its character profile
  return s.split(/[·;]/).map(part => {
    const t = part.trim();
    if (!t) return "";
    return `<a href="character.html?name=${encodeURIComponent(t)}">${escapeHTML(t)}</a>`;
  }).filter(Boolean).join(" · ");
}

function rowTier(row) {
  if (row.tier) return row.tier;
  const s = row.src || "";
  if (s === "sbs" || s === "manual") return "canon";
  if (s === "auto-extract") return "likely";
  return "speculation";
}
function tierBadge(tier) {
  const label = {canon:"CANON", likely:"LIKELY", speculation:"SPECUL."}[tier] || tier.toUpperCase();
  return `<span class="tier-badge ${tier}">${label}</span>`;
}
function chLink(chId) {
  if (!chId || !chId.startsWith("ch:")) return "";
  const n = parseInt(chId.slice(3));
  return `<a class="cite-canon" href="atlas.html?chapter=${n}">Ch. ${n}</a>`;
}
function _eaterRowChapter(row) {
  // ate-fruit rows store chapter as natural-key 'ch:N' or as plain int
  const c = row.chapter;
  if (typeof c === "number") return c;
  if (typeof c === "string" && c.startsWith("ch:")) return parseInt(c.slice(3), 10) || null;
  return null;
}
function renderEatersSection(fruitId) {
  if (!fruitId) return "";
  const rows = EATERS[fruitId];
  if (!rows || !rows.length) return "";
  let hiddenCount = 0;
  const html = rows.map(row => {
    // Per-row spoiler gate: if the row has a chapter > cutoff, hide it.
    // No chapter data → fail-closed unless caught up. (This is Patch 2 in
    // miniature for the ate-fruit shard.)
    const rowCh = _eaterRowChapter(row);
    const isPastCutoff = !_CAUGHT_UP && (
      (typeof rowCh === "number" && rowCh > _CUTOFF) ||
      (rowCh === null && (_CUTOFF < _LATEST_CH))
    );
    if (isPastCutoff) { hiddenCount++; return ""; }
    const name = row._display || row.from;
    const chrLink = `<a class="entity-link" href="character.html?id=${encodeURIComponent(row.from)}">${escapeHTML(name)}</a>`;
    const status = row.current === false ? " <em>(former)</em>" : "";
    const awk = row.awakened ? " · <strong>Awakened</strong>" : "";
    const ch = row.chapter ? " · " + chLink(row.chapter) : "";
    return `<div class="field"><div class="field-value">${tierBadge(rowTier(row))} ${chrLink}${status}${awk}${ch}</div></div>`;
  }).join("");
  const hiddenNote = hiddenCount > 0
    ? `<div style="font-size:0.78rem;color:var(--muted);font-style:italic;margin-top:6px">
         🛡 ${hiddenCount} eater${hiddenCount === 1 ? "" : "s"} hidden by Spoiler Guard.
       </div>`
    : "";
  return `<div class="section"><h3>Eaters (Shard)</h3>${html}${hiddenNote}</div>`;
}

// L11 fix: per-fruit refuse-render gate. Parses first_appearance for the
// chapter and shields the page if the fruit debuts past cutoff. Builds on
// existing _bootCutoff / _CAUGHT_UP. _CUTOFF was captured at script-load
// — re-read for refuse-render to be safe.
function _fruitDebutCh(f){
  if(typeof f.first_appearance==="string"){
    const m=f.first_appearance.match(/Chapter\s*(\d+)/i);
    if(m)return parseInt(m[1],10);
  }
  return null;
}
function _fruitUnlocked(name){
  try{const raw=JSON.parse(localStorage.getItem("codex-spoiler-state")||"null");return!!(raw&&raw.unlocked&&raw.unlocked[name]===true)}catch(_){return false}
}
function _fruitShield(name,debut,eff){
  document.title="Hidden by Spoiler Guard · Devil Fruits";
  return`<div class="crumbs"><a href="home.html">Home</a> › <a href="fruits.html">Devil Fruits</a> › <span style="color:var(--muted);font-style:italic">Hidden fruit</span></div>
    <section class="spoiler-banner" style="padding:24px 28px;border-radius:14px;border:1px solid var(--border);border-left:4px solid #6a9ec8;background:linear-gradient(135deg,#1a1610 0%,#251f15 100%);margin:18px 0">
      <h2 style="color:#f5c95e;letter-spacing:2px;font-size:1.05rem;margin-bottom:10px;text-transform:uppercase">🛡 Hidden by Spoiler Guard</h2>
      <p style="line-height:1.6;color:#e8d8b0;margin-bottom:14px">This Devil Fruit first appears in <strong>Chapter ${debut}</strong>, past your reading point (Ch.&nbsp;<strong>${eff}</strong>). The full profile would spoil its existence and its eater.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button onclick="window.codexSettings && window.codexSettings.open()" style="background:var(--surface2);color:var(--gold);border:1px solid var(--border);padding:9px 18px;border-radius:6px;cursor:pointer;font:inherit">⚙ Adjust shield</button>
        <button onclick="(function(){try{var st=JSON.parse(localStorage.getItem('codex-spoiler-state')||'{}');st.unlocked=st.unlocked||{};st.unlocked[${JSON.stringify(name)}]=true;localStorage.setItem('codex-spoiler-state',JSON.stringify(st))}catch(_){};location.reload()})()" style="background:var(--surface2);color:var(--ink-blue);border:1px solid var(--border);padding:9px 18px;border-radius:6px;cursor:pointer;font:inherit">👁 Reveal anyway (this fruit only)</button>
        <a href="fruits.html" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);padding:9px 18px;border-radius:6px;text-decoration:none;display:inline-flex;align-items:center">← Back to all fruits</a>
      </div>
    </section>`;
}

if (!requested) {
  root.innerHTML = `<div class="not-found"><h2>No fruit requested</h2><a href="fruits.html">← Browse all fruits</a></div>`;
} else {
  const f = RAW[requested];
  if (!f) {
    root.innerHTML = `<div class="not-found"><h2>No record for "${escapeHTML(requested)}"</h2><a href="fruits.html">← Browse all fruits</a></div>`;
  } else {
    // L11 gate
    const _fruitDebut = _fruitDebutCh(f);
    if (_fruitDebut && _fruitDebut > _CUTOFF && !_CAUGHT_UP && !_fruitUnlocked(requested)) {
      root.innerHTML = _fruitShield(requested, _fruitDebut, _CUTOFF);
    } else {
    document.title = `${f.name} · Devil Fruit · The Shimotsuki Codex`;
    // type_canonical reflects POST-reveal classification (e.g. Gomu Gomu shows
    // "Mythical Zoan" because of the Nika reveal). Hide that classification
    // when the corresponding reveal is gated.
    const _typeHidden = _isFruitRevealHidden(f.name) && (f.type_canonical || "").toLowerCase().match(/mythical|ancient/);
    const t = _typeHidden ? "Paramecia (pre-reveal)" : (f.type_canonical || f.type || "Unknown");
    const cls = typeClass(t);
    const quick = [];
    if (f.user_current)  quick.push(`<span><strong>User:</strong> ${userLink(f.user_current)}</span>`);
    if (f.first_appearance) quick.push(`<span><strong>Debut:</strong> ${escapeHTML(f.first_appearance)}</span>`);

    // Use _safeFieldValue so wiki-concatenated "pre\n----post" reveal data
    // (e.g. Gomu Gomu's Nika alias) is hidden when the user isn't caught up.
    const ident = [
      ["English",     f.name_en],
      ["Japanese",    f.name_jp],
      ["Romanised",   f.name_romaji],
      ["Translation", f.translation],
    ].filter(([_, v]) => v).map(([l, v]) =>
      `<div class="field"><div class="field-label">${l}</div><div class="field-value">${_safeFieldValue(f.name, v)}</div></div>`
    ).join("");

    const usage = [
      ["Current user",  userLink(f.user_current),  true],
      ["Previous user", userLink(f.user_previous), true],
      ["History",       userLink(f.user_history),  true],
      ["Awakened",      f.awakened || f.awakening, false],
      ["Creator",       f.creator, false],
    ].filter(([_, v]) => v).map(([l, v, raw]) =>
      `<div class="field"><div class="field-label">${l}</div><div class="field-value">${raw ? v : escapeHTML(v)}</div></div>`
    ).join("");

    root.innerHTML = `
      <div class="crumbs">
        <a href="home.html">Home</a> ›
        <a href="fruits.html">Devil Fruits</a> ›
        <span>${escapeHTML(f.name)}</span>
      </div>
      <div class="head ${cls}">
        ${(() => { const url = fruitImgUrl(f); return url ? `<div class="fruit-portrait-wrap">${escapeHTML(f.name[0])}<img src="${url}" alt="${escapeHTML(f.name)}" onerror="this.style.display='none'"></div>` : ""; })()}
        <div class="fruit-info">
          <div class="name">${escapeHTML(f.name)}</div>
          ${f.name_jp ? `<div class="name-jp">${_safeFieldValue(f.name, f.name_jp)}</div>` : ""}
          ${f.name_en ? `<div class="name-en">"${_safeFieldValue(f.name, f.name_en)}"</div>` : ""}
          <div class="type-badge ${cls}">${escapeHTML(t)}</div>
          ${quick.length ? `<div class="quick">${quick.join("")}</div>` : ""}
        </div>
      </div>
      <div class="sections">
        ${renderEatersSection(f.id)}
        ${ident ? `<div class="section"><h3>Identity</h3>${ident}</div>` : ""}
        ${usage ? `<div class="section"><h3>Usage</h3>${usage}</div>` : ""}
      </div>
    `;
    }  // close L11 gate else
  }
}
